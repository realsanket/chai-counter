# CI/CD for Chai Counter: every push to the cicd branch is tested, and only a green commit is packed into an image and
# pushed to GitHub's own registry (ghcr.io). The approval and the deploy after it are the next stations (the reel
# shows them; a real gate needs a "production" environment with required reviewers in the repo's settings).
name: CI/CD

on:
  push:
    branches: [cicd]

permissions:
  contents: read
  packages: write   # push to ghcr.io with the run's own token: no secret to store

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test
        run: pytest -v

  build:
    needs: test     # a red test stops the dabba here: no image is built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build the image
        run: docker build -t ghcr.io/realsanket/chai-counter:${{ github.sha }} .
      - name: Push it to the registry
        run: docker push ghcr.io/realsanket/chai-counter:${{ github.sha }}
