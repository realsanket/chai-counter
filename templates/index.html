<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chai Counter</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f4; color: #222; }
    main { max-width: 640px; margin: 64px auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 40px; }
    h1 { margin: 0 0 6px; font-size: 44px; }
    .sub { margin: 0 0 32px; color: #666; font-size: 20px; }
    .row { display: flex; align-items: center; gap: 20px; font-size: 28px; }
    .row a { display: inline-block; width: 56px; height: 56px; line-height: 54px; text-align: center; border: 1px solid #999;
             border-radius: 6px; text-decoration: none; color: #222; font-size: 32px; }
    .cups { min-width: 130px; text-align: center; }
    .total { margin: 32px 0 0; font-size: 28px; }
    .total b { font-size: 56px; }
    footer { margin-top: 36px; padding-top: 18px; border-top: 1px solid #eee; font-size: 18px; color: #777; line-height: 1.7; }
    footer code { color: #333; }
  </style>
</head>
<body>
  <main>
    <h1>Chai Counter</h1>
    <p class="sub">Pick your cups. We add it up.</p>

    <div class="row">
      <a href="/?cups={{ [cups - 1, 0] | max }}" aria-label="One cup less">−</a>
      <span class="cups">{{ cups }} cup{{ "" if cups == 1 else "s" }}</span>
      <a href="/?cups={{ [cups + 1, max_cups] | min }}" aria-label="One cup more">+</a>
    </div>

    <p class="total">{{ cups }} × ₹{{ price }} = <b>₹{{ total }}</b></p>

    <footer>
      Version <code>{{ version }}</code><br>
      Revision <code>{{ revision }}</code><br>
      Replica <code>{{ replica }}</code>
    </footer>
  </main>
</body>
</html>
